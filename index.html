<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>กาดหวยโมฬี สาขาปาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0D47A1;--navy-dark:#1A237E;--blue-light:#E3F2FD;--blue-mid:#90CAF9;--blue-bg:#F5F9FF;--teal:#00695C;--teal-light:#E0F2F1;--green:#2E7D32;--green-light:#E8F5E9;--red:#C62828;--red-light:#FFEBEE;--orange:#E65100;--orange-light:#FFF3E0;--purple:#6A1B9A;--purple-light:#F3E5F5;--gray:#546E7A;--gray-light:#90A4AE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai','Sarabun',sans-serif;background:linear-gradient(180deg,var(--blue-light)0%,var(--blue-bg)40%,#fff 100%);min-height:100vh;color:#333;-webkit-tap-highlight-color:transparent}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#app{max-width:480px;margin:0 auto;padding:16px 16px 32px}
.fi{animation:fi .3s ease-out}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.hidden{display:none!important}
.card{border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);background:var(--blue-light);border:2px solid transparent}
.card-t{font-size:14px;font-weight:600;color:var(--gray);margin-bottom:4px}
.card-v{font-size:24px;font-weight:900;color:var(--navy)}
.btn{width:100%;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s;font-family:inherit}
.btn:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,var(--navy),#1565C0);color:#fff}
.bt{background:linear-gradient(135deg,var(--teal),#00897B);color:#fff}
.bg{background:linear-gradient(135deg,var(--green),#43A047);color:#fff}
.bo{background:#fff;border:2px solid var(--navy);color:var(--navy)}
.bot{background:#fff;border:2px solid var(--teal);color:var(--teal)}
.bd{background:#B0BEC5!important;cursor:default}
.bs{padding:10px 16px;font-size:14px;border-radius:10px;width:auto}
.bb{width:100%;border-radius:16px;padding:20px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.12);position:relative;border:none;cursor:pointer;color:#fff;transition:transform .1s;font-family:inherit}
.bb:active{transform:scale(.98)}
.bb-c{display:flex;align-items:center;gap:12px}
.bb-i{font-size:30px}
.bb-t{font-size:20px;font-weight:700;line-height:1.3}
.badge{position:absolute;top:12px;right:12px;background:#EF5350;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border-radius:12px;font-size:18px;font-weight:600;color:var(--navy);background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit;transition:background .15s}
.nb:active{background:#BBDEFB}
.ig{margin-bottom:16px}
.il{display:block;font-size:18px;font-weight:600;color:var(--navy-dark);margin-bottom:4px}
.ir{display:flex;align-items:center;gap:8px}
.ii{width:100%;font-size:24px;font-weight:700;padding:16px;border-radius:12px;border:2px solid var(--blue-mid);background:var(--blue-bg);color:var(--navy);font-family:inherit;outline:none;min-height:56px}
.ii:focus{border-color:var(--navy)}
.is{font-size:20px;font-weight:700;color:var(--navy);white-space:nowrap}
.pw{margin-bottom:24px}
.pl{font-size:14px;font-weight:700;color:var(--navy-dark);margin-bottom:4px}
.pb{width:100%;height:12px;border-radius:6px;background:#BBDEFB;overflow:hidden}
.pf{height:100%;border-radius:6px;background:linear-gradient(90deg,#1565C0,var(--navy));transition:width .3s}
.sok{display:inline-block;padding:4px 12px;border-radius:20px;font-size:18px;font-weight:900;background:var(--green-light);color:var(--green)}
.sbd{display:inline-block;padding:4px 12px;border-radius:20px;font-size:18px;font-weight:900;background:var(--red-light);color:var(--red)}
.bk{display:inline-flex;align-items:center;gap:4px;font-size:18px;font-weight:700;color:#1565C0;background:none;border:none;cursor:pointer;margin-bottom:16px;font-family:inherit;padding:4px 0}
.bk:active{opacity:.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{display:flex;flex-direction:column}
.fr{display:flex;flex-direction:row}
.f1{flex:1}
.tr{display:flex;gap:8px;margin-bottom:16px}
.tb{flex:1;padding:12px;border-radius:12px;font-size:18px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.pn{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid var(--blue-light)}
.dv{border:none;border-top:1px solid var(--blue-light);margin:4px 0}
.pin-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:20px}
.pin-i{font-size:36px;font-weight:900;text-align:center;letter-spacing:12px;padding:16px 24px;border-radius:16px;border:3px solid var(--blue-mid);background:var(--blue-bg);color:var(--navy);width:260px;font-family:inherit;outline:none;-webkit-text-security:disc}
.pin-i:focus{border-color:var(--navy)}
.pin-e{color:var(--red);font-size:16px;font-weight:600;margin-top:8px;min-height:24px}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.sp{width:48px;height:48px;border:4px solid var(--blue-mid);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:ti .3s ease-out}
@keyframes ti{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.wait-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}
.dev-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:2px solid var(--blue-light)}
.dev-approved{border-color:#A5D6A7}
.dev-pending{border-color:#FFE082}
.dev-blocked{border-color:#EF9A9A}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// 🔥 FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDERFgSJ_RRPS2B8ZXXzAMq6sUSUywChp8",
  authDomain: "lottery-molee.firebaseapp.com",
  databaseURL: "https://lottery-molee-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lottery-molee",
  storageBucket: "lottery-molee.firebasestorage.app",
  messagingSenderId: "246332961593",
  appId: "1:246332961593:web:351398c63bc6a91e6e6ee8"
};

// ============================================================
// 🔑 PIN CONFIG
// ============================================================
const MASTER_PIN = "280628";
const STAFF_PIN = "888999";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
// DEVICE ID
// ============================================================
function getDeviceId() {
  let id = localStorage.getItem('lottery_device_id');
  if (!id) {
    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
    localStorage.setItem('lottery_device_id', id);
  }
  return id;
}
function getDeviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) {
    const m = ua.match(/;\s*([^;)]+)\s*Build/);
    return m ? m[1].trim() : 'Android';
  }
  if (/Windows/.test(ua)) return 'Windows PC';
  if (/Mac/.test(ua)) return 'Mac';
  return 'อุปกรณ์ไม่ทราบ';
}
const DEVICE_ID = getDeviceId();

// ============================================================
// CONSTANTS
// ============================================================
const TYPES=[{key:'singles',rkey:'remainSingles',label:'ใบเดี่ยว',price:90},{key:'set2',rkey:'remainSet2',label:'ชุด 2 ใบ',price:200},{key:'set3',rkey:'remainSet3',label:'ชุด 3 ใบ',price:340},{key:'set5',rkey:'remainSet5',label:'ชุด 5 ใบ',price:600},{key:'set10',rkey:'remainSet10',label:'ชุด 10 ใบ',price:2000}];
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fmt=n=>(n??0).toLocaleString('th-TH');
const fmtB=n=>`${fmt(n)} ฿`;
const thaiDate=ds=>{if(!ds)return'';const[y,m,d]=ds.split('-').map(Number);return`${d} ${TM[m-1]} ${y+543}`};
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const calcRV=r=>(r.remainSingles||0)*90+(r.remainSet2||0)*200+(r.remainSet3||0)*340+(r.remainSet5||0)*600+(r.remainSet10||0)*2000;
const calcSV=e=>(e||[]).reduce((s,x)=>s+TYPES.reduce((ss,t)=>ss+(x[t.key]||0)*t.price,0),0);

// ============================================================
// STORAGE HELPERS
// ============================================================
async function fbL(p,f){try{const s=await db.ref(p).once('value');return s.val()??f}catch(e){return f}}
async function fbS(p,d){try{await db.ref(p).set(d)}catch(e){console.error(e)}}

// ============================================================
// STATE
// ============================================================
let S={
  loading:true,authed:false,role:null,// 'master'|'staff'
  deviceStatus:null,// 'approved'|'pending'|'blocked'
  page:'home',
  periods:[],activePeriodId:null,
  stock:[],daily:[],scan:[],bookings:[],
  stepMain:1,stepScan:1,formMain:null,formScan:null,formStock:null,formBooking:null,
  showBookingForm:false,selectedHistory:null,historyTab:'main',summaryTab:'main',
  showPeriodForm:false,pName:'',pStart:todayStr(),pEnd:'',
  devices:[] // for master view
};

// ============================================================
// DEVICE MANAGEMENT
// ============================================================
async function registerDevice(role) {
  const devData = {
    id: DEVICE_ID,
    name: getDeviceName(),
    role: role,
    status: role === 'master' ? 'approved' : 'pending',
    registeredAt: new Date().toISOString(),
    lastSeen: new Date().toISOString()
  };
  await fbS(`devices/${DEVICE_ID}`, devData);
  return devData.status;
}

async function checkDevice() {
  const dev = await fbL(`devices/${DEVICE_ID}`, null);
  if (!dev) return null;
  // Update last seen
  await db.ref(`devices/${DEVICE_ID}/lastSeen`).set(new Date().toISOString());
  return dev;
}

async function loadDevices() {
  const devs = await fbL('devices', {});
  S.devices = Object.values(devs || {});
}

async function setDeviceStatus(devId, status) {
  await db.ref(`devices/${devId}/status`).set(status);
  await loadDevices();
  render();
  showToast(status === 'approved' ? '✅ อนุมัติแล้ว' : '🚫 บล็อกแล้ว');
}

async function removeDevice(devId) {
  await db.ref(`devices/${devId}`).remove();
  await loadDevices();
  render();
  showToast('🗑️ ลบอุปกรณ์แล้ว');
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadPeriods(){S.periods=await fbL('periods',[]);S.activePeriodId=await fbL('activePeriodId',null)}
async function loadPD(){
  const id=S.activePeriodId;
  if(!id){S.stock=[];S.daily=[];S.scan=[];S.bookings=[];return}
  S.stock=await fbL(`data/${id}/stock`,[]);S.daily=await fbL(`data/${id}/daily`,[]);
  S.scan=await fbL(`data/${id}/scan`,[]);S.bookings=await fbL(`data/${id}/bookings`,[]);
}
async function savePeriods(){await fbS('periods',S.periods);await fbS('activePeriodId',S.activePeriodId)}
async function saveStock(){if(S.activePeriodId)await fbS(`data/${S.activePeriodId}/stock`,S.stock)}
async function saveDaily(){if(S.activePeriodId)await fbS(`data/${S.activePeriodId}/daily`,S.daily)}
async function saveScan(){if(S.activePeriodId)await fbS(`data/${S.activePeriodId}/scan`,S.scan)}
async function saveBookings(){if(S.activePeriodId)await fbS(`data/${S.activePeriodId}/bookings`,S.bookings)}

function showToast(m,ms=2000){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}

function getD(){
  const tsv=calcSV(S.stock),cs=(S.daily||[]).reduce((s,r)=>s+(r.cashSales||0)+(r.transferSales||0),0);
  const ld=S.daily?.length>0?S.daily[S.daily.length-1]:null;
  const lrv=ld?calcRV(ld):0;
  const tbv=(S.bookings||[]).filter(b=>b.status!=='✅ครบ').reduce((s,b)=>s+(b.bookingValue||0),0);
  const sr=tsv-lrv-tbv,ac=ld?.actualCash||0,df=ac-sr,ok=df>=0||!S.daily?.length;
  const te=(S.daily||[]).some(r=>r.date===todayStr()),tse=(S.scan||[]).some(r=>r.date===todayStr());
  const ap=(S.periods||[]).find(p=>p.id===S.activePeriodId)||null;
  return{totalStockValue:tsv,cumulativeSales:cs,latestRemainValue:lrv,totalBookingValue:tbv,shouldReceive:sr,actualCash:ac,diffFromShould:df,statusOk:ok,todayRecordExists:te,todayScanExists:tse,activePeriod:ap};
}

// ============================================================
// RENDER
// ============================================================
function render(){
  const a=document.getElementById('app');
  if(S.loading){a.innerHTML='<div class="ld"><div class="sp"></div><p style="margin-top:16px;font-size:18px;color:var(--gray)">กำลังโหลดข้อมูล...</p></div>';return}
  if(!S.authed){a.innerHTML=renderPin();attachPin();return}
  if(S.role==='staff'&&S.deviceStatus==='pending'){a.innerHTML=renderWaiting();return}
  if(S.role==='staff'&&S.deviceStatus==='blocked'){a.innerHTML=renderBlocked();return}
  const d=getD();let h='';
  switch(S.page){
    case'home':h=renderHome(d);break;case'periods':h=renderPeriods(d);break;
    case'daily-main':h=renderDM(d);break;case'daily-scan':h=renderDS(d);break;
    case'stock':h=renderSt(d);break;case'bookings':h=renderBk(d);break;
    case'summary':h=renderSum(d);break;case'history':h=renderHist(d);break;
    case'devices':h=renderDevices();break;
    default:h=renderHome(d);
  }
  a.innerHTML=h;attachEv();
}

// ============================================================
// PIN SCREEN
// ============================================================
function renderPin(){
  return`<div class="pin-s fi">
    <div style="font-size:64px;margin-bottom:16px">🔒</div>
    <h1 style="font-size:24px;font-weight:900;color:var(--navy);margin-bottom:8px">กาดหวยโมฬี สาขาปาย</h1>
    <p style="font-size:16px;color:var(--gray);margin-bottom:24px">กรุณาใส่รหัส PIN เพื่อเข้าใช้งาน</p>
    <input type="password" inputmode="numeric" id="pinI" class="pin-i" maxlength="6" placeholder="••••••" autofocus>
    <div class="pin-e" id="pinE"></div>
    <button class="btn bp" style="width:260px;margin-top:16px" id="pinB">เข้าสู่ระบบ</button>
  </div>`;
}

function attachPin(){
  const i=document.getElementById('pinI'),b=document.getElementById('pinB'),e=document.getElementById('pinE');
  if(!i)return;
  const doLogin=async()=>{
    const v=i.value;
    if(v===MASTER_PIN){
      S.role='master';S.authed=true;S.deviceStatus='approved';
      sessionStorage.setItem('lottery_role','master');
      await registerDevice('master');
      await initData();
    } else if(v===STAFF_PIN){
      const dev=await checkDevice();
      if(dev&&dev.status==='approved'){
        S.role='staff';S.authed=true;S.deviceStatus='approved';
        sessionStorage.setItem('lottery_role','staff');
        await initData();
      } else if(dev&&dev.status==='blocked'){
        S.role='staff';S.authed=true;S.deviceStatus='blocked';
        render();
      } else {
        // New or pending device
        const st=await registerDevice('staff');
        S.role='staff';S.authed=true;S.deviceStatus=st;
        sessionStorage.setItem('lottery_role','staff');
        if(st==='approved') await initData();
        else render();
      }
    } else {
      e.textContent='❌ รหัส PIN ไม่ถูกต้อง';
      i.value='';i.focus();
    }
  };
  b.onclick=doLogin;
  i.onkeydown=e=>{if(e.key==='Enter')doLogin()};
}

// ============================================================
// WAITING / BLOCKED SCREENS
// ============================================================
function renderWaiting(){
  return`<div class="wait-s fi">
    <div style="font-size:64px;margin-bottom:16px">⏳</div>
    <h1 style="font-size:24px;font-weight:900;color:var(--navy);margin-bottom:8px">รอการอนุมัติ</h1>
    <p style="font-size:18px;color:var(--gray);margin-bottom:8px">อุปกรณ์นี้: <strong>${getDeviceName()}</strong></p>
    <p style="font-size:16px;color:var(--gray);margin-bottom:24px">กรุณารอเจ้าของระบบอนุมัติอุปกรณ์นี้ก่อน<br>แจ้งเจ้าของให้เข้าระบบแล้วกดอนุมัติ</p>
    <button class="btn bp" style="width:260px" onclick="recheckDevice()">🔄 ตรวจสอบอีกครั้ง</button>
    <button class="btn bo" style="width:260px;margin-top:12px" onclick="doLogout()">← กลับหน้าล็อกอิน</button>
  </div>`;
}

function renderBlocked(){
  return`<div class="wait-s fi">
    <div style="font-size:64px;margin-bottom:16px">🚫</div>
    <h1 style="font-size:24px;font-weight:900;color:var(--red);margin-bottom:8px">อุปกรณ์ถูกบล็อก</h1>
    <p style="font-size:18px;color:var(--gray);margin-bottom:24px">อุปกรณ์นี้ถูกบล็อกโดยเจ้าของระบบ<br>กรุณาติดต่อเจ้าของเพื่อขอปลดบล็อก</p>
    <button class="btn bo" style="width:260px" onclick="doLogout()">← กลับหน้าล็อกอิน</button>
  </div>`;
}

async function recheckDevice(){
  showToast('🔄 กำลังตรวจสอบ...');
  const dev=await checkDevice();
  if(dev&&dev.status==='approved'){
    S.deviceStatus='approved';
    await initData();
    showToast('✅ อนุมัติแล้ว!');
  } else if(dev&&dev.status==='blocked'){
    S.deviceStatus='blocked';
    render();
  } else {
    showToast('⏳ ยังไม่ได้รับอนุมัติ');
  }
}

// ============================================================
// DEVICE MANAGEMENT PAGE (Master only)
// ============================================================
function renderDevices(){
  const devs=S.devices||[];
  const pending=devs.filter(d=>d.status==='pending');
  const approved=devs.filter(d=>d.status==='approved');
  const blocked=devs.filter(d=>d.status==='blocked');

  const devCard=(d)=>{
    const isSelf=d.id===DEVICE_ID;
    const cls=d.status==='approved'?'dev-approved':d.status==='pending'?'dev-pending':'dev-blocked';
    const stLabel=d.status==='approved'?'✅ อนุมัติแล้ว':d.status==='pending'?'⏳ รอนุมัติ':'🚫 ถูกบล็อก';
    const lastSeen=d.lastSeen?new Date(d.lastSeen).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'ไม่ทราบ';
    let btns='';
    if(!isSelf){
      if(d.status==='pending') btns=`<div class="fr" style="gap:8px;margin-top:8px"><button class="bs f1" style="background:var(--green);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDeviceStatus('${d.id}','approved')">✅ อนุมัติ</button><button class="bs f1" style="background:var(--red);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDeviceStatus('${d.id}','blocked')">🚫 บล็อก</button></div>`;
      else if(d.status==='approved') btns=`<div class="fr" style="gap:8px;margin-top:8px"><button class="bs f1" style="background:var(--red);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDeviceStatus('${d.id}','blocked')">🚫 บล็อก</button><button class="bs" style="background:#FFEBEE;color:var(--red);border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="removeDevice('${d.id}')">🗑️ ลบ</button></div>`;

  const f=S.formStock,ev=TYPES.reduce((s,t)=>s+(f[t.key]||0)*t.price,0);
  const lH=(S.stock||[]).map((e,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--blue-light)"><div><div style="font-weight:700;color:var(--navy)">${thaiDate(e.date)}</div><div style="font-size:14px;color:var(--gray)">${TYPES.filter(t=>e[t.key]>0).map(t=>`${t.label}:${e[t.key]}`).join(' | ')}</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700;color:#1B5E20">${fmtB(e.totalValue)}</span><button style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--red)" onclick="delSt(${i})">🗑️</button></div></div>`).join('');
  return`<div class="fi"><button class="bk" onclick="nav('home')">← กลับ</button><h2 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:16px">📦 หวยเข้า-Stock — ${d.activePeriod?.name||''}</h2><div class="card" style="text-align:center;margin-bottom:16px"><div style="font-size:14px">มูลค่า Stock สะสม</div><div style="font-size:30px;font-weight:900;color:var(--navy)">${fmtB(d.totalStockValue)}</div></div><div class="pn" style="margin-bottom:16px"><h3 style="font-size:18px;font-weight:700;color:var(--navy-dark);margin-bottom:12px">➕ บันทึกหวยเข้าใหม่</h3><div class="ig"><label class="il">📆 วันที่รับเข้า</label><input type="date" class="ii" id="stD" value="${f.date}" style="font-size:20px"></div>${TYPES.map(t=>nI(`${t.label} (${t.price}฿)`,`st_${t.key}`,f[t.key],'ใบ/ชุด')).join('')}<div class="card" style="text-align:center;background:var(--green-light);margin-bottom:12px"><div style="font-size:14px">มูลค่ารอบนี้</div><div style="font-size:24px;font-weight:700;color:var(--green)">${fmtB(ev)}</div></div><button class="btn ${ev>0?'bp':'bd'}" onclick="svSt()">💾 บันทึก</button></div>${(S.stock||[]).length?`<div class="pn"><h3 style="font-size:18px;font-weight:700;color:var(--navy-dark);margin-bottom:12px">📋 ประวัติหวยเข้า</h3>${lH}</div>`:''}</div>`;
}

// ============================================================
// BOOKINGS
// ============================================================
function renderBk(d){
  const tbv=(S.bookings||[]).filter(b=>b.status!=='✅ครบ').reduce((s,b)=>s+(b.bookingValue||0),0);
  let fH='';
  if(S.showBookingForm){
    if(!S.formBooking)S.formBooking={customerName:'',singles:0,set2:0,set3:0,set5:0,set10:0};
    const bf=S.formBooking,bv=TYPES.reduce((s,t)=>s+(bf[t.key]||0)*t.price,0);
    fH=`<div class="pn fi" style="margin-bottom:16px"><h3 style="font-size:18px;font-weight:700;color:var(--navy-dark);margin-bottom:12px">เพิ่มลูกค้าจอง</h3><div class="ig"><label class="il">ชื่อลูกค้า</label><input type="text" class="ii" id="bkN" value="${bf.customerName}" placeholder="ชื่อลูกค้า" style="font-size:20px"></div>${TYPES.map(t=>nI(t.label,`bk_${t.key}`,bf[t.key],'ใบ/ชุด')).join('')}<div class="card" style="text-align:center;margin-bottom:12px"><div style="font-size:14px">มูลค่าจอง</div><div style="font-size:20px;font-weight:700;color:var(--navy)">${fmtB(bv)}</div></div><div class="fr" style="gap:12px"><button class="btn bo f1" onclick="S.showBookingForm=false;S.formBooking=null;render()">ยกเลิก</button><button class="btn bp f1" onclick="svBk()">💾 บันทึก</button></div></div>`;
  }
  const lH=(S.bookings||[]).map(b=>{
    const bc=b.status==='✅ครบ'?'#A5D6A7':b.status==='⚠️ไม่ครบ'?'#FFE082':'var(--blue-mid)';
    return`<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:2px solid ${bc}"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-size:18px;font-weight:700;color:var(--navy)">${b.customerName}</div><div style="font-size:14px;color:var(--gray)">มูลค่า: ${fmtB(b.bookingValue)}</div>${b.paidDate?`<div style="font-size:12px;color:#78909C">จ่าย: ${thaiDate(b.paidDate)} — ${fmtB(b.paidAmount||0)}</div>`:''}</div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700">${b.status}</span><button style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--red)" onclick="delBk('${b.id}')">🗑️</button></div></div>${b.status==='⏳รอ'?`<div class="fr" style="gap:8px"><button class="bs f1" style="background:var(--green);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="upBk('${b.id}','✅ครบ',${b.bookingValue})">จ่ายครบ</button><button class="bs f1" style="background:#F9A825;color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="upBk('${b.id}','⚠️ไม่ครบ',0)">จ่ายไม่ครบ</button></div>`:''}</div>`}).join('');
  return`<div class="fi"><button class="bk" onclick="nav('home')">← กลับ</button><h2 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:16px">📋 ลูกค้าจอง — ${d.activePeriod?.name||''}</h2><div class="card" style="text-align:center;background:var(--orange-light);margin-bottom:16px"><div style="font-size:14px">มูลค่าจองค้างทั้งหมด</div><div style="font-size:24px;font-weight:700;color:var(--orange)">${fmtB(tbv)}</div></div>${!S.showBookingForm?`<button class="btn bp" style="margin-bottom:16px" onclick="S.showBookingForm=true;S.formBooking=null;render()">➕ เพิ่มลูกค้าจอง</button>`:''} ${fH}${!(S.bookings||[]).length?'<div style="text-align:center;padding:32px 0;font-size:18px;color:var(--gray-light)">ยังไม่มีลูกค้าจอง</div>':''}${lH}</div>`;
}

// ============================================================
// SUMMARY
// ============================================================
function renderSum(d){
  const tab=S.summaryTab,rv=d.latestRemainValue;
  const scRS=(S.scan||[]).reduce((s,r)=>s+(r.receiveSingles||0),0),scRS2=(S.scan||[]).reduce((s,r)=>s+(r.receiveSet2||0),0);
  const scSS=(S.scan||[]).reduce((s,r)=>s+(r.sellSingles||0),0),scSS2=(S.scan||[]).reduce((s,r)=>s+(r.sellSet2||0),0);
  const scC=scRS*80+scRS2*160,scR=scSS*90+scSS2*200,scF=(S.scan||[]).reduce((s,r)=>s+(r.scanFee||0),0),scN=scR-scC-scF;
  const scRemS=(S.scan||[]).length?S.scan[S.scan.length-1].remainSingles||0:0,scRemS2=(S.scan||[]).length?S.scan[S.scan.length-1].remainSet2||0:0;
  const mC=`${cH('📦','มูลค่า Stock รับเข้า',fmtB(d.totalStockValue),'var(--navy)','var(--blue-light)')}${cH('💰','ยอดขายจริง (สะสม)',fmtB(d.cumulativeSales),'var(--green)','var(--green-light)')}${cH('🎟️','มูลค่าหวยเหลือ',fmtB(rv),'var(--orange)','var(--orange-light)')}${cH('📋','มูลค่าจองค้าง',fmtB(d.totalBookingValue),'var(--purple)','var(--purple-light)')}${cH('💵','เงินในมือ',fmtB(d.actualCash),'var(--navy)','var(--blue-light)')}${cH('🎯','ควรได้รับ',fmtB(d.shouldReceive),'var(--navy)','var(--blue-light)')}${cH(d.diffFromShould>=0?'✅':'❌','ผลต่าง',`${d.diffFromShould>=0?'+':''}${fmtB(d.diffFromShould)}`,d.diffFromShould>=0?'var(--green)':'var(--red)',d.diffFromShould>=0?'var(--green-light)':'var(--red-light)')}<button class="btn bo" onclick="cpM()">📋 คัดลอกสรุป</button>`;
  const sC=`${cH('📥','รับเข้าทั้งหมด',`เดี่ยว ${fmt(scRS)} | ชุด2 ${fmt(scRS2)}`,'var(--teal)','var(--teal-light)')}${cH('📤','ขายออกทั้งหมด',`เดี่ยว ${fmt(scSS)} | ชุด2 ${fmt(scSS2)}`,'var(--green)','var(--green-light)')}${cH('💸','ต้นทุนรวม',fmtB(scC),'var(--orange)','var(--orange-light)')}${cH('💰','รายรับรวม',fmtB(scR),'var(--green)','var(--green-light)')}${cH('🙏','ค่าน้ำใจรวม',fmtB(scF),'var(--purple)','var(--purple-light)')}${cH('🎟️','คงเหลือ',`เดี่ยว ${fmt(scRemS)} | ชุด2 ${fmt(scRemS2)}`,'var(--navy)','var(--blue-light)')}${cH('⭐','กำไรสุทธิงวดนี้',fmtB(scN),scN>=0?'var(--green)':'var(--red)',scN>=0?'var(--green-light)':'var(--red-light)')}<button class="btn bot" onclick="cpS()">📋 คัดลอกสรุป</button>`;
  return`<div class="fi"><button class="bk" onclick="nav('home')">← กลับ</button><h2 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:16px">📊 สรุป — ${d.activePeriod?.name||''}</h2><div class="tr"><button class="tb" style="background:${tab==='main'?'var(--navy)':'var(--blue-light)'};color:${tab==='main'?'#fff':'var(--navy)'}" onclick="S.summaryTab='main';render()">🏪 ร้านใหญ่</button><button class="tb" style="background:${tab==='scan'?'var(--teal)':'var(--teal-light)'};color:${tab==='scan'?'#fff':'var(--teal)'}" onclick="S.summaryTab='scan';render()">📱 ร้านสแกน</button></div><div class="fc" style="gap:12px">${tab==='main'?mC:sC}</div></div>`;
}

// ============================================================
// HISTORY
// ============================================================
function renderHist(d){
  const tab=S.historyTab;let cH2='';
  if(tab==='main'){
    if(S.selectedHistory){const r=S.selectedHistory,ts=(r.cashSales||0)+(r.transferSales||0);cH2=`<div class="fi"><button style="font-size:18px;font-weight:700;color:#1565C0;background:none;border:none;cursor:pointer;margin-bottom:12px;font-family:inherit" onclick="S.selectedHistory=null;render()">← กลับรายการ</button><h3 style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:12px">${thaiDate(r.date)}</h3><div class="fc" style="gap:8px">${cH('💵','เงินสด',fmtB(r.cashSales),'var(--navy)','var(--blue-light)')}${cH('📲','โอน',fmtB(r.transferSales),'var(--navy)','var(--blue-light)')}${cH('💰','รวม',fmtB(ts),'var(--green)','var(--green-light)')}${cH('🎟️','หวยเหลือ',fmtB(calcRV(r)),'var(--orange)','var(--orange-light)')}${cH('💵','เงินในมือ',fmtB(r.actualCash),'var(--navy)','var(--blue-light)')}</div></div>`}
    else if(!(S.daily||[]).length)cH2='<div style="text-align:center;padding:40px 0;font-size:18px;color:var(--gray-light)">ยังไม่มีข้อมูล</div>';
    else cH2=[...S.daily].reverse().map((r,i)=>{const ts=(r.cashSales||0)+(r.transferSales||0);return`<button style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05);border:1px solid var(--blue-light);cursor:pointer;font-family:inherit;text-align:left" onclick="S.selectedHistory=S.daily[${S.daily.length-1-i}];render()"><div><div style="font-weight:700;font-size:18px;color:var(--navy)">${thaiDate(r.date)}</div><div style="font-size:14px;color:var(--gray)">ขาย: ${fmtB(ts)}</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--navy)">${fmtB(r.actualCash)}</div><div style="font-size:12px;color:var(--gray-light)">เงินในมือ</div></div></button>`}).join('');
  } else {
    if(!(S.scan||[]).length)cH2='<div style="text-align:center;padding:40px 0;font-size:18px;color:var(--gray-light)">ยังไม่มีข้อมูล</div>';
    else cH2=[...S.scan].reverse().map(r=>{const np=(r.sellSingles||0)*10+(r.sellSet2||0)*40-(r.scanFee||0);return`<div style="display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05);border:1px solid var(--teal-light)"><div><div style="font-weight:700;font-size:18px;color:var(--teal)">${thaiDate(r.date)}</div><div style="font-size:14px;color:var(--gray)">ขาย: เดี่ยว ${r.sellSingles||0} ชุด2 ${r.sellSet2||0}</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:700;color:${np>=0?'var(--green)':'var(--red)'}">${fmtB(np)}</div><div style="font-size:12px;color:var(--gray-light)">กำไรสุทธิ</div></div></div>`}).join('');
  }
  return`<div class="fi"><button class="bk" onclick="nav('home')">← กลับ</button><h2 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:16px">📜 ประวัติรายวัน — ${d.activePeriod?.name||''}</h2><div class="tr"><button class="tb" style="background:${tab==='main'?'var(--navy)':'var(--blue-light)'};color:${tab==='main'?'#fff':'var(--navy)'}" onclick="S.historyTab='main';S.selectedHistory=null;render()">🏪 ร้านใหญ่</button><button class="tb" style="background:${tab==='scan'?'var(--teal)':'var(--teal-light)'};color:${tab==='scan'?'#fff':'var(--teal)'}" onclick="S.historyTab='scan';S.selectedHistory=null;render()">📱 ร้านสแกน</button></div>${cH2}</div>`;
}

// ============================================================
// HELPERS
// ============================================================
function nI(l,id,v,sf){return`<div class="ig"><label class="il">${l}</label><div class="ir"><input type="number" inputmode="numeric" class="ii" id="${id}" value="${v||''}" placeholder="0">${sf?`<span class="is">${sf}</span>`:''}</div></div>`}
function gV(id){const e=document.getElementById(id);return e?(Number(e.value)||0):0}
function gS(id){const e=document.getElementById(id);return e?e.value.trim():''}

function nav(p){S.page=p;S.selectedHistory=null;if(p==='daily-main'){S.stepMain=1;S.formMain=null}if(p==='daily-scan'){S.stepScan=1;S.formScan=null}if(p==='stock')S.formStock=null;if(p==='bookings'){S.showBookingForm=false;S.formBooking=null}render();window.scrollTo(0,0)}

// ACTIONS
async function createPeriod(){const n=gS('pN'),s=gS('pS'),e=gS('pE');if(!n||!s||!e)return;const id='p_'+Date.now();if(!S.periods)S.periods=[];S.periods.push({id,name:n,startDate:s,endDate:e,createdAt:todayStr()});S.activePeriodId=id;S.showPeriodForm=false;S.pName='';S.pStart=todayStr();S.pEnd='';await savePeriods();await loadPD();showToast('✅ สร้างงวดเรียบร้อย');nav('home')}
async function selectPeriod(id){S.activePeriodId=id;await fbS('activePeriodId',id);await loadPD();showToast('✅ เลือกงวดแล้ว');nav('home')}
async function deletePeriod(id){if(!confirm('ลบงวดนี้และข้อมูลทั้งหมด?'))return;S.periods=(S.periods||[]).filter(p=>p.id!==id);if(S.activePeriodId===id)S.activePeriodId=null;await savePeriods();await db.ref(`data/${id}`).remove();await loadPD();showToast('🗑️ ลบงวดแล้ว');render()}

function rdM(){const f=S.formMain,st=S.stepMain;if(st===1){f.cashSales=gV('fmC');f.transferSales=gV('fmT')}if(st===2)TYPES.forEach(t=>{f[t.rkey]=gV(`fm_${t.rkey}`)});if(st===3){f.bookingCount=gV('fmBC');f.bookingValue=gV('fmBV')}if(st===4)f.actualCash=gV('fmA')}
async function svM(){const f=S.formMain;if(!S.daily)S.daily=[];const i=S.daily.findIndex(r=>r.date===f.date);if(i>=0)S.daily[i]=f;else S.daily.push(f);await saveDaily();S.formMain=null;S.stepMain=1;showToast('💾 บันทึกร้านใหญ่แล้ว');nav('home')}

function rdS(){const f=S.formScan,st=S.stepScan;if(st===1){f.receiveSingles=gV('fsRS');f.receiveSet2=gV('fsRS2')}if(st===2){f.sellSingles=gV('fsSS');f.sellSet2=gV('fsSS2')}if(st===3)f.scanFee=gV('fsF')}
async function svS(){const f=S.formScan,prs=f._pRS||0,prs2=f._pRS2||0;f.remainSingles=prs+(f.receiveSingles||0)-(f.sellSingles||0);f.remainSet2=prs2+(f.receiveSet2||0)-(f.sellSet2||0);delete f._pRS;delete f._pRS2;if(!S.scan)S.scan=[];const i=S.scan.findIndex(r=>r.date===f.date);if(i>=0)S.scan[i]=f;else S.scan.push(f);await saveScan();S.formScan=null;S.stepScan=1;showToast('💾 บันทึกร้านสแกนแล้ว');nav('home')}

async function svSt(){const f={date:gS('stD')||todayStr()};TYPES.forEach(t=>{f[t.key]=gV(`st_${t.key}`)});f.totalValue=TYPES.reduce((s,t)=>s+(f[t.key]||0)*t.price,0);if(f.totalValue===0)return;if(!S.stock)S.stock=[];S.stock.push(f);await saveStock();S.formStock=null;showToast('💾 บันทึกหวยเข้าแล้ว');render()}
async function delSt(i){S.stock.splice(i,1);await saveStock();render()}

async function svBk(){const n=gS('bkN');if(!n)return;const b={id:String(Date.now()),customerName:n,status:'⏳รอ',paidDate:'',paidAmount:0};TYPES.forEach(t=>{b[t.key]=gV(`bk_${t.key}`)});b.bookingValue=TYPES.reduce((s,t)=>s+(b[t.key]||0)*t.price,0);if(!S.bookings)S.bookings=[];S.bookings.push(b);await saveBookings();S.showBookingForm=false;S.formBooking=null;showToast('💾 บันทึกลูกค้าจองแล้ว');render()}
async function upBk(id,st,pa){S.bookings=(S.bookings||[]).map(b=>b.id===id?{...b,status:st,paidAmount:pa??b.paidAmount,paidDate:todayStr()}:b);await saveBookings();render()}
async function delBk(id){S.bookings=(S.bookings||[]).filter(b=>b.id!==id);await saveBookings();render()}

function cpM(){const d=getD();const t=`📊 สรุป ${d.activePeriod?.name}\n🏪 ร้านใหญ่\nStock: ${fmtB(d.totalStockValue)}\nขาย: ${fmtB(d.cumulativeSales)}\nเหลือ: ${fmtB(d.latestRemainValue)}\nจอง: ${fmtB(d.totalBookingValue)}\nเงินในมือ: ${fmtB(d.actualCash)}\nควรได้: ${fmtB(d.shouldReceive)}\nผลต่าง: ${fmtB(d.diffFromShould)}`;navigator.clipboard?.writeText(t);showToast('📋 คัดลอกแล้ว')}
function cpS(){const d=getD();const scRS=(S.scan||[]).reduce((s,r)=>s+(r.receiveSingles||0),0),scSS=(S.scan||[]).reduce((s,r)=>s+(r.sellSingles||0),0);const t=`📊 สรุป ${d.activePeriod?.name}\n📱 ร้านสแกน\nรับ: ${scRS}\nขาย: ${scSS}\nกำไรสุทธิ: ${fmtB(scSS*90-scRS*80-(S.scan||[]).reduce((s,r)=>s+(r.scanFee||0),0))}`;navigator.clipboard?.writeText(t);showToast('📋 คัดลอกแล้ว')}

function doLogout(){S.authed=false;S.role=null;S.deviceStatus=null;sessionStorage.removeItem('lottery_role');render()}

function attachEv(){const pN=document.getElementById('pN'),pS=document.getElementById('pS'),pE=document.getElementById('pE');if(pN)pN.oninput=()=>{S.pName=pN.value};if(pS)pS.onchange=()=>{S.pStart=pS.value};if(pE)pE.onchange=()=>{S.pEnd=pE.value}}

// ============================================================
// INIT
// ============================================================
async function initData(){S.loading=true;render();try{await loadPeriods();await loadPD();if(S.role==='master')await loadDevices()}catch(e){console.error(e);showToast('⚠️ โหลดข้อมูลไม่สำเร็จ',3000)}S.loading=false;render()}

// Session restore
const savedRole=sessionStorage.getItem('lottery_role');
if(savedRole){
  S.loading=true;S.authed=true;S.role=savedRole;render();
  (async()=>{
    const dev=await checkDevice();
    if(savedRole==='master'){S.deviceStatus='approved';await initData()}
    else if(dev?.status==='approved'){S.deviceStatus='approved';await initData()}
    else if(dev?.status==='blocked'){S.deviceStatus='blocked';S.loading=false;render()}
    else{S.deviceStatus='pending';S.loading=false;render()}
  })();
} else {S.loading=false;render()}
</script>
</body>
</html>
