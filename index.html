<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>กาดหวยโมฬี สาขาปาย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--n:#0D47A1;--nd:#1A237E;--bl:#E3F2FD;--bm:#90CAF9;--bb:#F5F9FF;--g:#2E7D32;--gl:#E8F5E9;--r:#C62828;--rl:#FFEBEE;--o:#E65100;--ol:#FFF3E0;--p:#6A1B9A;--pl:#F3E5F5;--gr:#546E7A;--grl:#90A4AE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:linear-gradient(180deg,var(--bl)0%,var(--bb)40%,#fff 100%);min-height:100vh;color:#333;-webkit-tap-highlight-color:transparent}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}
#app{max-width:480px;margin:0 auto;padding:16px 16px 32px}
.fi{animation:fi .3s ease-out}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pu 2s infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
.cd{border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);background:var(--bl)}
.ct{font-size:14px;font-weight:600;color:var(--gr);margin-bottom:4px}.cv{font-size:24px;font-weight:900;color:var(--n)}
.btn{width:100%;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s;font-family:inherit}.btn:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,var(--n),#1565C0);color:#fff}.bg{background:linear-gradient(135deg,var(--g),#43A047);color:#fff}
.bo{background:#fff;border:2px solid var(--n);color:var(--n)}.bd{background:#B0BEC5!important;cursor:default}
.bs{padding:10px 16px;font-size:14px;border-radius:10px;width:auto}
.bb{width:100%;border-radius:16px;padding:20px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.12);position:relative;border:none;cursor:pointer;color:#fff;transition:transform .1s;font-family:inherit}.bb:active{transform:scale(.98)}
.bbc{display:flex;align-items:center;gap:12px}.bbi{font-size:30px}.bbt{font-size:20px;font-weight:700;line-height:1.3}
.bdg{position:absolute;top:12px;right:12px;background:#EF5350;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border-radius:12px;font-size:18px;font-weight:600;color:var(--n);background:0;border:none;cursor:pointer;text-align:left;font-family:inherit}.nb:active{background:#BBDEFB}
.ig{margin-bottom:16px}.il{display:block;font-size:18px;font-weight:600;color:var(--nd);margin-bottom:4px}
.ir{display:flex;align-items:center;gap:8px}
.ii{width:100%;font-size:24px;font-weight:700;padding:16px;border-radius:12px;border:2px solid var(--bm);background:var(--bb);color:var(--n);font-family:inherit;outline:none;min-height:56px}.ii:focus{border-color:var(--n)}
.iit{width:100%;font-size:18px;font-weight:600;padding:14px;border-radius:12px;border:2px solid var(--bm);background:var(--bb);color:var(--n);font-family:inherit;outline:none}
.is{font-size:20px;font-weight:700;color:var(--n);white-space:nowrap}
.pw{margin-bottom:24px}.pbl{font-size:14px;font-weight:700;color:var(--nd);margin-bottom:4px}
.pbr{width:100%;height:12px;border-radius:6px;background:#BBDEFB;overflow:hidden}.pbf{height:100%;border-radius:6px;background:linear-gradient(90deg,#1565C0,var(--n));transition:width .3s}
.bk{display:inline-flex;align-items:center;gap:4px;font-size:18px;font-weight:700;color:#1565C0;background:none;border:none;cursor:pointer;margin-bottom:16px;font-family:inherit}.bk:active{opacity:.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fc{display:flex;flex-direction:column}.fr{display:flex}.f1{flex:1}
.pn{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid var(--bl)}
.dv{border:none;border-top:1px solid var(--bl);margin:4px 0}
.pin-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:20px}
.pin-i{font-size:36px;font-weight:900;text-align:center;letter-spacing:12px;padding:16px 24px;border-radius:16px;border:3px solid var(--bm);background:var(--bb);color:var(--n);width:260px;font-family:inherit;outline:none;-webkit-text-security:disc}.pin-i:focus{border-color:var(--n)}
.pin-e{color:var(--r);font-size:16px;font-weight:600;margin-top:8px;min-height:24px}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.sp{width:48px;height:48px;border:4px solid var(--bm);border-top-color:var(--n);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:ti .3s ease-out;max-width:90%}@keyframes ti{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.wait-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}
.mv{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border-left:4px solid var(--bm);font-size:16px}.mv-add{border-left-color:var(--g)}.mv-cut{border-left-color:var(--r)}
.alert-box{border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:15px;font-weight:600}
.alert-ok{background:var(--gl);color:var(--g);border:1px solid #A5D6A7}.alert-err{background:var(--rl);color:var(--r);border:1px solid #EF9A9A}.alert-warn{background:var(--ol);color:var(--o);border:1px solid #FFE082}
.sep{border:none;border-top:2px dashed var(--bm);margin:20px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDERFgSJ_RRPS2B8ZXXzAMq6sUSUywChp8",authDomain:"lottery-molee.firebaseapp.com",databaseURL:"https://lottery-molee-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"lottery-molee",storageBucket:"lottery-molee.firebasestorage.app",messagingSenderId:"246332961593",appId:"1:246332961593:web:351398c63bc6a91e6e6ee8"};
const MASTER_PIN="280628",STAFF_PIN="888999";
firebase.initializeApp(firebaseConfig);const db=firebase.database();

function getDevId(){let id=localStorage.getItem('ld_id');if(!id){id='d_'+Date.now()+'_'+Math.random().toString(36).substr(2,9);localStorage.setItem('ld_id',id)}return id}
function getDevName(){const u=navigator.userAgent;if(/iPhone/.test(u))return'iPhone';if(/iPad/.test(u))return'iPad';if(/Android/.test(u)){const m=u.match(/;\s*([^;)]+)\s*Build/);return m?m[1].trim():'Android'}if(/Windows/.test(u))return'Windows PC';if(/Mac/.test(u))return'Mac';return'อุปกรณ์'}
const DID=getDevId();

const TY=[{k:'singles',r:'remainSingles',s:'soldSingles',l:'ใบเดี่ยว',p:90},{k:'set2',r:'remainSet2',s:'soldSet2',l:'ชุด 2 ใบ',p:200},{k:'set3',r:'remainSet3',s:'soldSet3',l:'ชุด 3 ใบ',p:340},{k:'set5',r:'remainSet5',s:'soldSet5',l:'ชุด 5 ใบ',p:600},{k:'set10',r:'remainSet10',s:'soldSet10',l:'ชุด 10 ใบ',p:2000}];
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fmt=n=>(n??0).toLocaleString('th-TH');const fmtB=n=>`${fmt(n)} ฿`;
const tD=ds=>{if(!ds)return'';const[y,m,d]=ds.split('-').map(Number);return`${d} ${TM[m-1]} ${y+543}`};
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const now=()=>new Date().toISOString();
const cRV=r=>TY.reduce((s,t)=>s+(r[t.r]||0)*t.p,0);
const cSV=e=>(e||[]).reduce((s,x)=>s+TY.reduce((ss,t)=>ss+(x[t.k]||0)*t.p,0),0);
const cSoldV=f=>TY.reduce((s,t)=>s+(f[t.s]||0)*t.p,0);

async function fL(p,f){try{const s=await db.ref(p).once('value');return s.val()??f}catch{return f}}
async function fS(p,d){try{await db.ref(p).set(d)}catch(e){console.error(e)}}
function toast(m,ms=2000){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}

let S={loading:true,authed:false,role:null,deviceStatus:null,page:'home',
  periods:[],activePeriodId:null,stock:[],daily:[],bookings:[],transfers:[],devices:[],
  stepMain:1,formMain:null,formStock:null,
  showPeriodForm:false,pName:'',pStart:today(),pEnd:'',
  selectedHistory:null,bkMode:null,bkNote:'',
  // booking add breakdown
  bkSingles:0,bkSet2:0,bkSet3:0,bkSet5:0,bkSet10:0,
  bkAmount:0, // for cut mode
  showTfForm:false,tfAmount:0,tfNote:''};

// Auth
async function regDev(role){await fS(`devices/${DID}`,{id:DID,name:getDevName(),role,status:role==='master'?'approved':'pending',registeredAt:now(),lastSeen:now()});return role==='master'?'approved':'pending'}
async function chkDev(){const d=await fL(`devices/${DID}`,null);if(d)await db.ref(`devices/${DID}/lastSeen`).set(now());return d}
async function loadDevs(){S.devices=Object.values(await fL('devices',{})||{})}
async function setDevSt(id,st){await db.ref(`devices/${id}/status`).set(st);await loadDevs();render();toast(st==='approved'?'✅ อนุมัติแล้ว':'🚫 บล็อกแล้ว')}
async function rmDev(id){await db.ref(`devices/${id}`).remove();await loadDevs();render();toast('🗑️ ลบแล้ว')}

async function loadPeriods(){S.periods=await fL('periods',[]);S.activePeriodId=await fL('activePeriodId',null)}
async function loadPD(){const id=S.activePeriodId;if(!id){S.stock=[];S.daily=[];S.bookings=[];S.transfers=[];return}
  S.stock=await fL(`data/${id}/stock`,[]);S.daily=await fL(`data/${id}/daily`,[]);
  S.bookings=await fL(`data/${id}/bookings`,[]);S.transfers=await fL(`data/${id}/transfers`,[])}
async function savePeriods(){await fS('periods',S.periods);await fS('activePeriodId',S.activePeriodId)}
async function saveD(k){if(S.activePeriodId)await fS(`data/${S.activePeriodId}/${k}`,S[k])}

function getD(){
  const tsv=cSV(S.stock);
  const cs=(S.daily||[]).reduce((s,r)=>s+(r.cashSales||0)+(r.transferSales||0),0);
  const ld=S.daily?.length?S.daily[S.daily.length-1]:null;
  const lrv=ld?cRV(ld):0;
  const bkBal=(S.bookings||[]).reduce((s,b)=>s+(b.type==='add'?b.amount:-(b.amount||0)),0);
  const sr=tsv-lrv-bkBal;
  const totalTf=(S.transfers||[]).reduce((s,t)=>s+(t.amount||0),0);
  const pendTf=cs-totalTf;
  const te=(S.daily||[]).some(r=>r.date===today());
  const ap=(S.periods||[]).find(p=>p.id===S.activePeriodId)||null;
  const balCheck=tsv-(lrv+bkBal+cs);
  return{tsv,cs,lrv,bkBal,sr,totalTf,pendTf,te,ap,balCheck,ld};
}

// ============================================================
// RENDER
// ============================================================
function render(){
  const a=document.getElementById('app');
  if(S.loading){a.innerHTML='<div class="ld"><div class="sp"></div><p style="margin-top:16px;font-size:18px;color:var(--gr)">กำลังโหลด...</p></div>';return}
  if(!S.authed){a.innerHTML=rPin();aPin();return}
  if(S.role==='staff'&&S.deviceStatus==='pending'){a.innerHTML='<div class="wait-s fi"><div style="font-size:64px;margin-bottom:16px">⏳</div><h1 style="font-size:24px;font-weight:900;color:var(--n)">รอการอนุมัติ</h1><p style="font-size:18px;color:var(--gr);margin-bottom:8px">อุปกรณ์: <b>'+getDevName()+'</b></p><p style="font-size:16px;color:var(--gr);margin-bottom:24px">กรุณารอเจ้าของอนุมัติ</p><button class="btn bp" style="width:260px" onclick="rechk()">🔄 ตรวจสอบ</button><button class="btn bo" style="width:260px;margin-top:12px" onclick="doLogout()">← กลับ</button></div>';return}
  if(S.role==='staff'&&S.deviceStatus==='blocked'){a.innerHTML='<div class="wait-s fi"><div style="font-size:64px;margin-bottom:16px">🚫</div><h1 style="font-size:24px;font-weight:900;color:var(--r)">อุปกรณ์ถูกบล็อก</h1><p style="font-size:16px;color:var(--gr);margin-bottom:24px">กรุณาติดต่อเจ้าของ</p><button class="btn bo" style="width:260px" onclick="doLogout()">← กลับ</button></div>';return}
  const d=getD();let h='';const pg=S.page;
  if(pg==='home')h=rHome(d);else if(pg==='periods')h=rPeriods(d);else if(pg==='daily')h=rDaily(d);
  else if(pg==='stock')h=rStock(d);else if(pg==='bookings')h=rBk(d);else if(pg==='transfers')h=rTf(d);
  else if(pg==='summary')h=rSum(d);else if(pg==='history')h=rHist(d);else if(pg==='devices')h=rDevs();
  else h=rHome(d);
  a.innerHTML=h;aEv();
}

function rPin(){return`<div class="pin-s fi"><div style="font-size:64px;margin-bottom:16px">🔒</div><h1 style="font-size:24px;font-weight:900;color:var(--n);margin-bottom:8px">กาดหวยโมฬี สาขาปาย</h1><p style="font-size:16px;color:var(--gr);margin-bottom:24px">กรุณาใส่รหัส PIN</p><input type="password" inputmode="numeric" id="pinI" class="pin-i" maxlength="6" placeholder="••••••" autofocus><div class="pin-e" id="pinE"></div><button class="btn bp" style="width:260px;margin-top:16px" id="pinB">เข้าสู่ระบบ</button></div>`}
function aPin(){const i=document.getElementById('pinI'),b=document.getElementById('pinB'),e=document.getElementById('pinE');if(!i)return;const go=async()=>{const v=i.value;if(v===MASTER_PIN){S.role='master';S.authed=true;S.deviceStatus='approved';sessionStorage.setItem('lr','master');await regDev('master');await initData()}else if(v===STAFF_PIN){const dev=await chkDev();if(dev?.status==='approved'){S.role='staff';S.authed=true;S.deviceStatus='approved';sessionStorage.setItem('lr','staff');await initData()}else if(dev?.status==='blocked'){S.role='staff';S.authed=true;S.deviceStatus='blocked';render()}else{const st=await regDev('staff');S.role='staff';S.authed=true;S.deviceStatus=st;sessionStorage.setItem('lr','staff');if(st==='approved')await initData();else render()}}else{e.textContent='❌ รหัสไม่ถูกต้อง';i.value='';i.focus()}};b.onclick=go;i.onkeydown=ev=>{if(ev.key==='Enter')go()}}
async function rechk(){toast('🔄 ตรวจสอบ...');const d=await chkDev();if(d?.status==='approved'){S.deviceStatus='approved';await initData();toast('✅ อนุมัติแล้ว!')}else if(d?.status==='blocked'){S.deviceStatus='blocked';render()}else toast('⏳ ยังไม่ได้อนุมัติ')}

// HOME
function rHome(d){
  if(!d.ap)return`<div style="text-align:center;padding-top:60px" class="fi"><div style="font-size:64px;margin-bottom:16px">🎰</div><h1 style="font-size:24px;font-weight:900;color:var(--n);margin-bottom:8px">กาดหวยโมฬี สาขาปาย</h1><p style="font-size:18px;color:var(--gr);margin-bottom:24px">กรุณาสร้างงวดก่อน</p><button class="btn bp" style="width:auto;padding:16px 32px" onclick="nav('periods')">📅 สร้างงวดแรก</button></div>`;
  const p=d.ap,pc=(S.devices||[]).filter(x=>x.status==='pending').length;
  let al='';if(d.cs>0||d.lrv>0){al=Math.abs(d.balCheck)>0?`<div class="alert-box alert-err">⚠️ ไม่สมดุล ${fmtB(Math.abs(d.balCheck))} — ตรวจสอบ Stock/เหลือ/จอง/ขาย</div>`:`<div class="alert-box alert-ok">✅ สมดุล — Stock = เหลือ + จอง + ขาย</div>`}
  return`<div class="fi"><div style="text-align:center;margin-bottom:20px"><div style="font-size:48px;margin-bottom:8px">🎰</div><h1 style="font-size:24px;font-weight:900;color:var(--n)">กาดหวยโมฬี สาขาปาย</h1>
    <button onclick="nav('periods')" style="margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:20px;font-size:15px;font-weight:700;background:var(--bl);color:var(--n);border:2px solid var(--bm);cursor:pointer;font-family:inherit">📅 ${p.name} <span style="font-size:13px;color:var(--gr)">(${tD(p.startDate)}—${tD(p.endDate)})</span> ▾</button>
    <div style="font-size:15px;color:var(--gr);margin-top:8px">${S.role==='master'?'👑 เจ้าของ':'👤 พนักงาน'} • ${tD(today())}</div></div>
    ${al}
    <div class="g2" style="margin-bottom:16px">${cH('💰','ยอดขายสะสม',fmtB(d.cs),'var(--n)','var(--bl)')}${cH('🎯','ควรได้รับ',fmtB(d.sr),'var(--n)','var(--bl)')}${cH('📋','จองค้าง',fmtB(d.bkBal),'var(--o)','var(--ol)')}${cH('💸','ค้างโอน',fmtB(d.pendTf),d.pendTf>0?'var(--o)':'var(--g)',d.pendTf>0?'var(--ol)':'var(--gl)')}</div>
    <button class="bb" style="background:linear-gradient(135deg,var(--n),#1565C0);margin-bottom:16px" onclick="nav('daily')"><div class="bbc"><span class="bbi">📝</span><span class="bbt">กรอกข้อมูลวันนี้</span></div>${!d.te?'<span class="bdg pulse">ยังไม่กรอก</span>':''}</button>
    <div class="pn">
      <button class="nb" onclick="nav('stock')">📦 หวยเข้า-Stock</button>
      <button class="nb" onclick="nav('bookings')">📋 ลูกค้าจอง <span style="font-size:14px;color:var(--o)">(${fmtB(d.bkBal)})</span></button>
      <button class="nb" onclick="nav('transfers')">💸 โอนเงิน <span style="font-size:14px;color:${d.pendTf>0?'var(--o)':'var(--g)'}">(ค้าง ${fmtB(d.pendTf)})</span></button>
      <button class="nb" onclick="nav('summary')">📊 สรุปงวด</button>
      <button class="nb" onclick="nav('history')">📜 ประวัติรายวัน</button>
      <hr class="dv"><button class="nb" onclick="nav('periods')">📅 จัดการงวด</button>
      ${S.role==='master'?`<button class="nb" style="color:var(--p)" onclick="loadDevs().then(()=>nav('devices'))">📱 จัดการอุปกรณ์${pc?` <span style="background:var(--r);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px">${pc}</span>`:''}</button>`:''}
      <button class="nb" style="color:var(--r)" onclick="doLogout()">🔒 ออกจากระบบ</button>
    </div></div>`;
}
function cH(i,t,v,c,b){return`<div class="cd" style="background:${b}"><div class="ct">${i} ${t}</div><div class="cv" style="color:${c}">${v}</div></div>`}

// ============================================================
// DAILY (2 Steps — Step1 = Sales+SoldBreakdown, Step2 = Remain+Note)
// ============================================================
function rDaily(d){
  if(!S.formMain){const ex=(S.daily||[]).find(r=>r.date===today());S.formMain=ex?{...ex}:{date:today(),cashSales:0,transferSales:0,soldSingles:0,soldSet2:0,soldSet3:0,soldSet5:0,soldSet10:0,remainSingles:0,remainSet2:0,remainSet3:0,remainSet5:0,remainSet10:0,note:''}}
  const f=S.formMain,st=S.stepMain;
  const ts=(f.cashSales||0)+(f.transferSales||0);
  const prev=(S.daily||[]).filter(r=>r.date!==f.date).reduce((s,r)=>s+(r.cashSales||0)+(r.transferSales||0),0);
  const cum=prev+ts;
  const soldVal=cSoldV(f);
  const diff=ts-soldVal;
  const rv=cRV(f);

  let sH='';
  if(st===1){
    // Check status
    let chkH='';
    if(ts>0||soldVal>0){
      if(diff===0)chkH=`<div class="alert-box alert-ok">✅ ยอดเงิน = มูลค่าหวยขาย ตรงกัน!</div>`;
      else if(diff>0)chkH=`<div class="alert-box alert-warn">⚠️ ยอดเงินมากกว่ามูลค่าหวย ${fmtB(diff)} — อาจมีเงินจากจองมารับ?</div>`;

function rPeriods(d){let fH='';if(S.showPeriodForm){const ok=S.pName&&S.pStart&&S.pEnd;fH=`<div class="pn fi" style="border:2px solid var(--bm);margin-bottom:20px"><h3 style="font-size:18px;font-weight:700;color:var(--nd);margin-bottom:16px">สร้างงวดใหม่</h3><div class="ig"><label class="il">ชื่องวด</label><input type="text" class="ii" id="pN" value="${S.pName}" placeholder="เช่น งวด 1 เม.ย. 69" style="font-size:20px"></div><div class="ig"><label class="il">📆 วันเริ่ม</label><input type="date" class="ii" id="pS" value="${S.pStart}" style="font-size:20px"></div><div class="ig"><label class="il">📆 วันสิ้นสุด</label><input type="date" class="ii" id="pE" value="${S.pEnd}" style="font-size:20px"></div>${S.pStart&&S.pEnd?`<div class="cd" style="text-align:center;background:var(--gl);margin-bottom:16px"><div class="cv" style="font-size:18px;color:var(--g)">${tD(S.pStart)} — ${tD(S.pEnd)}</div></div>`:''}<div class="fr" style="gap:12px"><button class="btn bo f1" onclick="S.showPeriodForm=false;render()">ยกเลิก</button><button class="btn ${ok?'bp':'bd'} f1" onclick="createP()">✅ สร้าง</button></div></div>`}
const lH=[...(S.periods||[])].reverse().map(p=>{const ia=p.id===S.activePeriodId;return`<div class="pn" style="margin-bottom:12px;border:2px solid ${ia?'var(--n)':'var(--bl)'};${ia?'background:var(--bl)':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1;cursor:pointer" onclick="selP('${p.id}')"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">${ia?'<span style="background:#1A237E;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px">กำลังใช้</span>':''}<span style="font-size:18px;font-weight:900;color:var(--n)">${p.name}</span></div><div style="font-size:15px;color:var(--gr)">${tD(p.startDate)} — ${tD(p.endDate)}</div></div><div style="display:flex;gap:8px">${!ia?`<button class="bs" style="background:var(--n);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="selP('${p.id}')">เลือก</button>`:''}<button class="bs" style="background:var(--rl);color:var(--r);border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="delP('${p.id}')">🗑️</button></div></div></div>`}).join('');
return`<div class="fi">${d.ap?'<button class="bk" onclick="nav(\'home\')">← กลับ</button>':''}<h2 style="font-size:20px;font-weight:900;color:var(--n);margin-bottom:8px">📅 จัดการงวด</h2>${!S.showPeriodForm?`<button class="btn bp" style="margin-bottom:20px" onclick="S.showPeriodForm=true;render()">➕ สร้างงวดใหม่</button>`:''} ${fH} ${lH}${!(S.periods||[]).length?'<div style="text-align:center;padding:40px 0"><div style="font-size:48px;margin-bottom:12px">📅</div><div style="font-size:20px;font-weight:700;color:var(--grl)">ยังไม่มีงวด</div></div>':''}</div>`}

// DEVICES
function rDevs(){const devs=S.devices||[];const dC=d=>{const me=d.id===DID;const ls=d.lastSeen?new Date(d.lastSeen).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'';let bt='';if(!me){if(d.status==='pending')bt=`<div class="fr" style="gap:8px;margin-top:8px"><button class="bs f1" style="background:var(--g);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDevSt('${d.id}','approved')">✅</button><button class="bs f1" style="background:var(--r);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDevSt('${d.id}','blocked')">🚫</button></div>`;else if(d.status==='approved')bt=`<div class="fr" style="gap:8px;margin-top:8px"><button class="bs f1" style="background:var(--r);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDevSt('${d.id}','blocked')">🚫 บล็อก</button><button class="bs" style="background:var(--rl);color:var(--r);border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="rmDev('${d.id}')">🗑️</button></div>`;else bt=`<div class="fr" style="gap:8px;margin-top:8px"><button class="bs f1" style="background:var(--g);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="setDevSt('${d.id}','approved')">✅ ปลดบล็อก</button><button class="bs" style="background:var(--rl);color:var(--r);border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="rmDev('${d.id}')">🗑️</button></div>`}return`<div class="pn" style="margin-bottom:12px;border:2px solid ${d.status==='approved'?'#A5D6A7':d.status==='pending'?'#FFE082':'#EF9A9A'}"><div style="font-size:18px;font-weight:700;color:var(--n)">${d.name||''} ${me?'<span style="font-size:12px;background:var(--n);color:#fff;padding:2px 8px;border-radius:10px">เครื่องนี้</span>':''}</div><div style="font-size:14px;color:var(--gr)">${d.role==='master'?'👑':'👤'} • ${d.status==='approved'?'✅':d.status==='pending'?'⏳':'🚫'} • ${ls}</div>${bt}</div>`};
const sec=(st,lbl,clr)=>{const g=devs.filter(d=>d.status===st);return g.length?`<div style="margin-bottom:16px"><h3 style="font-size:16px;font-weight:700;color:${clr};margin-bottom:8px">${lbl} (${g.length})</h3>${g.map(dC).join('')}</div>`:''};
return`<div class="fi"><button class="bk" onclick="nav('home')">← กลับ</button><h2 style="font-size:20px;font-weight:900;color:var(--n);margin-bottom:16px">📱 จัดการอุปกรณ์</h2>${sec('pending','⏳ รออนุมัติ','var(--o)')}${sec('approved','✅ อนุมัติแล้ว','var(--g)')}${sec('blocked','🚫 ถูกบล็อก','var(--r)')}</div>`}

// ============================================================
// HELPERS & ACTIONS
// ============================================================
function nI(l,id,v,sf){return`<div class="ig"><label class="il">${l}</label><div class="ir"><input type="number" inputmode="numeric" class="ii" id="${id}" value="${v||''}" placeholder="0">${sf?`<span class="is">${sf}</span>`:''}</div></div>`}
function gV(id){const e=document.getElementById(id);return e?(Number(e.value)||0):0}
function gS(id){const e=document.getElementById(id);return e?e.value.trim():''}
function nav(p){S.page=p;S.selectedHistory=null;S.bkMode=null;S.showTfForm=false;if(p==='daily'){S.stepMain=1;S.formMain=null}if(p==='stock')S.formStock=null;render();window.scrollTo(0,0)}

async function createP(){const n=gS('pN'),s=gS('pS'),e=gS('pE');if(!n||!s||!e)return;const id='p_'+Date.now();if(!S.periods)S.periods=[];S.periods.push({id,name:n,startDate:s,endDate:e});S.activePeriodId=id;S.showPeriodForm=false;S.pName='';S.pStart=today();S.pEnd='';await savePeriods();await loadPD();toast('✅ สร้างงวดแล้ว');nav('home')}
async function selP(id){S.activePeriodId=id;await fS('activePeriodId',id);await loadPD();toast('✅ เลือกงวดแล้ว');nav('home')}
async function delP(id){if(!confirm('ลบงวดนี้?'))return;S.periods=(S.periods||[]).filter(p=>p.id!==id);if(S.activePeriodId===id)S.activePeriodId=null;await savePeriods();await db.ref(`data/${id}`).remove();await loadPD();toast('🗑️ ลบแล้ว');render()}

function rdF(){const f=S.formMain,st=S.stepMain;
  if(st===1){f.cashSales=gV('fC');f.transferSales=gV('fT');TY.forEach(t=>{f[t.s]=gV(`f_${t.s}`)})}
  if(st===2){TY.forEach(t=>{f[t.r]=gV(`f_${t.r}`)});f.note=gS('fNote')}}
async function svF(){const f=S.formMain;if(!S.daily)S.daily=[];const i=S.daily.findIndex(r=>r.date===f.date);if(i>=0)S.daily[i]=f;else S.daily.push(f);await saveD('daily');S.formMain=null;S.stepMain=1;toast('💾 บันทึกแล้ว');nav('home')}

async function svSt(){const f={date:gS('stD')||today()};TY.forEach(t=>{f[t.k]=gV(`st_${t.k}`)});f.totalValue=TY.reduce((s,t)=>s+(f[t.k]||0)*t.p,0);if(f.totalValue===0)return;if(!S.stock)S.stock=[];S.stock.push(f);await saveD('stock');S.formStock=null;toast('💾 บันทึกหวยเข้าแล้ว');render()}
async function delSt(i){S.stock.splice(i,1);await saveD('stock');render()}

async function addBk(){
  const bkS=gV('bkS'),bkS2=gV('bkS2'),bkS3=gV('bkS3'),bkS5=gV('bkS5'),bkS10=gV('bkS10');
  const amount=bkS*90+bkS2*200+bkS3*340+bkS5*600+bkS10*2000;
  const n=gS('bkN');
  if(!amount)return;
  const breakdown={singles:bkS,set2:bkS2,set3:bkS3,set5:bkS5,set10:bkS10};
  if(!S.bookings)S.bookings=[];
  S.bookings.push({type:'add',amount,breakdown,note:n,date:today(),ts:now()});
  await saveD('bookings');S.bkMode=null;toast('✅ เพิ่มจองแล้ว');render()}
async function cutBk(){const a=gV('bkA'),n=gS('bkN');if(!a)return;if(!S.bookings)S.bookings=[];S.bookings.push({type:'cut',amount:a,note:n,date:today(),ts:now()});await saveD('bookings');S.bkMode=null;toast('✅ ตัดจองแล้ว');render()}

async function addTf(){const a=gV('tfA'),n=gS('tfN');if(!a)return;if(!S.transfers)S.transfers=[];S.transfers.push({amount:a,note:n,date:today(),ts:now()});await saveD('transfers');S.showTfForm=false;toast('💸 บันทึกโอนแล้ว');render()}

function cpSum(){const d=getD();const t=`📊 สรุป ${d.ap?.name}\nStock: ${fmtB(d.tsv)}\nขาย: ${fmtB(d.cs)}\nเหลือ: ${fmtB(d.lrv)}\nจอง: ${fmtB(d.bkBal)}\nควรได้: ${fmtB(d.sr)}\nโอนแล้ว: ${fmtB(d.totalTf)}\nค้างโอน: ${fmtB(d.pendTf)}`;navigator.clipboard?.writeText(t);toast('📋 คัดลอกแล้ว')}
function doLogout(){S.authed=false;S.role=null;S.deviceStatus=null;sessionStorage.removeItem('lr');render()}
function aEv(){const pN=document.getElementById('pN'),pS=document.getElementById('pS'),pE=document.getElementById('pE');if(pN)pN.oninput=()=>{S.pName=pN.value};if(pS)pS.onchange=()=>{S.pStart=pS.value};if(pE)pE.onchange=()=>{S.pEnd=pE.value}}

async function initData(){S.loading=true;render();try{await loadPeriods();await loadPD();if(S.role==='master')await loadDevs()}catch(e){console.error(e);toast('⚠️ โหลดไม่สำเร็จ',3000)}S.loading=false;render()}
const sr=sessionStorage.getItem('lr');
if(sr){S.loading=true;S.authed=true;S.role=sr;render();(async()=>{const dev=await chkDev();if(sr==='master'){S.deviceStatus='approved';await initData()}else if(dev?.status==='approved'){S.deviceStatus='approved';await initData()}else if(dev?.status==='blocked'){S.deviceStatus='blocked';S.loading=false;render()}else{S.deviceStatus='pending';S.loading=false;render()}})()}else{S.loading=false;render()}
</script>
</body>
</html>
